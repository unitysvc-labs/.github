name: Upload Data to Production (reusable)

# Reusable production upload shared by every unitysvc-services-* repo.
# Callers invoke it with:
#   jobs:
#     upload:
#       permissions:
#         contents: write
#         actions: read     # needed to find the previous upload state artifact
#       uses: unitysvc-labs/.github/.github/workflows/seller-upload-production.yml@main
#       secrets: inherit
#
# `secrets: inherit` forwards the caller repo's secrets, so the named keys
# (UNITYSVC_SELLER_PRODUCTION_API_*) and the dynamic provider secrets picked up
# via toJSON(secrets) below are all available without re-declaring them here.
#
# Production uploads are manual (workflow_dispatch in the caller) and assume the
# service IDs already exist in production (created by an earlier staging run).

on:
  workflow_call:
    inputs:
      full:
        description: >-
          Send every service, ignoring the saved upload state (the state is still
          rewritten). Use for an occasional full resync.
        type: boolean
        default: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install unitysvc-sellers
        run: |
          python -m pip install --upgrade pip
          # >=0.3.12: reads member-services/ (and platform-services/) — older
          # releases fail before uploading anything (unitysvc#2569).
          # >=0.3.24: `specs upload --state` (skip services unchanged since
          # their last ingest).
          pip install "unitysvc-sellers>=0.3.24"

      - name: Seed seller-secrets store
        env:
          UNITYSVC_SELLER_API_KEY: ${{ secrets.UNITYSVC_SELLER_PRODUCTION_API_KEY }}
          UNITYSVC_SELLER_API_URL: ${{ secrets.UNITYSVC_SELLER_PRODUCTION_API_URL }}
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
          ALL_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          # Seller secrets live in a repo-committed seller.secrets.txt manifest (the
          # seller-secrets convention; supersedes the .env.example manifest of
          # unitysvc#1709). It declares each secret with descriptions and env-aware
          # declares its secrets with descriptions and env-aware ${NAME:-default}
          # values. Export every GitHub variable then secret (secrets win) so the
          # manifest's defaults resolve to real values, then upload it in one call
          # — values AND the comment-block descriptions surfaced to customers
          # (unitysvc#1618). GitHub auto-masks secret values in the log.
          if [ -f services/seller.secrets.txt ]; then
            echo "Seeding from seller.secrets.txt (values from GitHub secrets/vars; descriptions from the file)."
            eval "$(printf '%s' "$ALL_VARS_JSON"    | jq -r 'to_entries[] | select(.key|test("^[A-Z_][A-Z0-9_]*$")) | "export \(.key)=\(.value|@sh)"')"
            eval "$(printf '%s' "$ALL_SECRETS_JSON" | jq -r 'to_entries[] | select(.key|test("^[A-Z_][A-Z0-9_]*$")) | "export \(.key)=\(.value|@sh)"')"
            usvc_seller secrets upload services/seller.secrets.txt
            exit 0
          fi
          # Fallback for repos with no manifest: auto-derive the referenced names
          # from every ${ customer_secrets.X } / ${ secrets.X } under specs/,
          # templates/, or data/, and set each from GitHub secrets/vars (values
          # only, no descriptions). Templated forms like
          # ${ customer_secrets.{{ params.X }} } are NOT matched directly — they're
          # covered transitively when the per-service user_parameters_schema
          # defaults the param to the literal name used by the non-plus variant.
          # `|| true` keeps a repo with no references from tripping grep's exit-1.
          names="$( { grep -rEhno \
            '\$\{\s*(customer_secrets|secrets)\.[A-Za-z_][A-Za-z0-9_]*' \
            services/specs/ services/templates/ services/data/ 2>/dev/null || true; } \
            | sed -E 's/.*(customer_secrets|secrets)\.([A-Za-z_][A-Za-z0-9_]*).*/\2/' \
            | sort -u)"
          if [ -z "$names" ]; then
            echo "No services/seller.secrets.txt and no secret references under services/specs/, services/templates/, or services/data/."
            exit 0
          fi
          echo "Found secret references:"
          printf '  - %s\n' $names
          seeded=0
          missing=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            value="$(printf '%s' "$ALL_SECRETS_JSON" | jq -r --arg n "$name" '.[$n] // empty')"
            if [ -z "$value" ]; then
              # Fall back to a repo variable (non-sensitive config); secrets win.
              value="$(printf '%s' "$ALL_VARS_JSON" | jq -r --arg n "$name" '.[$n] // empty')"
            fi
            if [ -z "$value" ]; then
              echo "::warning::Secret '$name' referenced in the repo has no value in GitHub secrets or variables; skipping."
              missing=$((missing+1))
              continue
            fi
            echo "::add-mask::$value"
            printf '%s' "$value" | usvc_seller secrets set "$name"
            seeded=$((seeded+1))
          done <<< "$names"
          echo "Seeded $seeded secret(s); $missing missing."

      - name: Restore upload state
        # The state file records, per service, what the last upload to this target
        # sent, so an unchanged service is not ingested again. It is kept as a
        # workflow artifact named for the target and is looked up repo-wide, newest
        # first, whatever branch or event produced it: the state describes the
        # target, not a branch, and a service whose content differs from the
        # recorded fingerprint is sent again anyway. Needs `actions: read` from the
        # caller. A missing, expired or unreadable artifact is not an error: every
        # service is simply sent, as before.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .upload-state
          run_id="$(gh api "repos/$REPO/actions/artifacts?name=upload-state-production&per_page=10" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty' 2>/dev/null || true)"
          if [ -z "$run_id" ]; then
            echo "No previous upload state for production; every service will be sent."
          elif gh run download "$run_id" --repo "$REPO" -n upload-state-production -D .upload-state; then
            echo "Restored upload state from run $run_id."
          else
            echo "::warning::Could not download the upload state of run $run_id; every service will be sent."
            rm -f .upload-state/state.json
          fi

      - name: Upload services
        env:
          UPLOAD_FULL: ${{ inputs.full }}
          UNITYSVC_SELLER_API_KEY: ${{ secrets.UNITYSVC_SELLER_PRODUCTION_API_KEY }}
          UNITYSVC_SELLER_API_URL: ${{ secrets.UNITYSVC_SELLER_PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          # Retry transient transport failures. The backend sometimes drops
          # the connection mid-upload on large catalogs ("Server disconnected
          # without sending a response" — huggingface twice and ollama once on
          # 2026-11-20, each fixed by a plain re-run). Since populate PRs can
          # now auto-merge, nobody is watching this run, and a failure here
          # leaves production stale until the next merge. Only connection-level
          # errors are retried: a validation or auth failure is not going to
          # pass on a second try and should fail fast. The upload is safe to
          # repeat — it is the same command a manual re-run executes.
          retry_transient() {
            local attempt=1 max=4 delay=30 log rc
            log="$(mktemp)"
            while :; do
              set +e
              "$@" 2>&1 | tee "$log"
              rc=${PIPESTATUS[0]}
              set -e
              [ "$rc" -eq 0 ] && return 0
              if [ "$attempt" -ge "$max" ] || ! grep -qiE 'server disconnected|connection (reset|refused|closed|aborted|error)|connect(ion)? ?timeout|timed out|remoteprotocolerror|readerror|connecterror|(502|503|504) (bad gateway|service unavailable|gateway time-?out)' "$log"; then
                return "$rc"
              fi
              echo "::warning::Attempt $attempt/$max failed with a transient connection error; retrying in ${delay}s."
              sleep "$delay"
              attempt=$((attempt+1)); delay=$((delay*2))
            done
          }
          echo "Uploading + submitting services to production..."
          # --submit folds the submit-for-review (validate -> pending -> run
          # tests) into the ingest task, so no separate submit step is needed.
          # Upload from the repository root so discovery includes both
          # services/specs/ and the sibling platform_services/ member-param
          # tree.
          retry_transient usvc_seller specs upload --submit --state "$GITHUB_WORKSPACE/.upload-state/state.json" $( [ "$UPLOAD_FULL" = "true" ] && echo --force )

      - name: Save upload state
        # Also after a failed upload: the state records which services were
        # ingested, so the next run retries only the rest.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: upload-state-production
          path: .upload-state/state.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Publish services
        env:
          UNITYSVC_SELLER_API_KEY: ${{ secrets.UNITYSVC_SELLER_PRODUCTION_API_KEY }}
          UNITYSVC_SELLER_API_URL: ${{ secrets.UNITYSVC_SELLER_PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          # Same transient-failure retry as the upload step above.
          retry_transient() {
            local attempt=1 max=4 delay=30 log rc
            log="$(mktemp)"
            while :; do
              set +e
              "$@" 2>&1 | tee "$log"
              rc=${PIPESTATUS[0]}
              set -e
              [ "$rc" -eq 0 ] && return 0
              if [ "$attempt" -ge "$max" ] || ! grep -qiE 'server disconnected|connection (reset|refused|closed|aborted|error)|connect(ion)? ?timeout|timed out|remoteprotocolerror|readerror|connecterror|(502|503|504) (bad gateway|service unavailable|gateway time-?out)' "$log"; then
                return "$rc"
              fi
              echo "::warning::Attempt $attempt/$max failed with a transient connection error; retrying in ${delay}s."
              sleep "$delay"
              attempt=$((attempt+1)); delay=$((delay*2))
            done
          }
          echo "Publishing services to make them visible in the catalog..."
          retry_transient usvc_seller services set-visibility public --local-ids --data-dir services/specs --yes

      - name: Upload summary
        if: always()
        run: |
          echo "## Upload Summary (Production)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Uploaded to Backend" >> $GITHUB_STEP_SUMMARY
          echo "- Backend URL: \`${{ secrets.UNITYSVC_SELLER_PRODUCTION_API_URL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered manually by: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
