name: Populate Services (reusable)

# Reusable populate-services shared by every unitysvc-services-* repo.
# Callers invoke it with:
#   jobs:
#     populate-services:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: unitysvc-labs/.github/.github/workflows/seller-populate-services.yml@main
#       secrets: inherit
#
# Provider API keys are repo secrets. `secrets: inherit` makes them available
# in the `secrets` context; the populate step then exports every inherited
# secret as an env var so `usvc_seller specs populate` finds its provider key
# regardless of name (FIREWORKS_API_KEY, OPENAI_API_KEY, ...). Repos that don't
# need populate simply omit the caller.

on:
  workflow_call:

jobs:
  populate-services:
    name: Populate Services Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "unitysvc-sellers>=0.2.0"

      - name: Execute populate services command
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          # Export every inherited repo secret as an env var so provider
          # populate commands find their API key regardless of name. Mask each
          # value. (GITHUB_TOKEN is provided separately and not in `secrets`.)
          while IFS= read -r k; do
            v="$(jq -r --arg k "$k" '.[$k]' <<<"$ALL_SECRETS_JSON")"
            echo "::add-mask::$v"
            export "$k=$v"
          done < <(jq -r 'keys[]' <<<"$ALL_SECRETS_JSON")
          echo "Running populate services command..."
          usvc_seller specs populate

      - name: Check for changes in specs/ directory
        id: check_changes
        run: |
          echo "Checking for changes in specs/ directory..."
          git add data/
          if git diff --cached --exit-code data/; then
            echo "No changes detected in specs/ directory"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in specs/ directory"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Auto-populate services data

            Automated update of services data via usvc_seller specs populate

            Generated with GitHub Actions
          title: "Auto-populate services data"
          body: |
            ## Summary

            This PR contains automatically generated changes from running `usvc_seller specs populate`.

            ## Changes Made

            - Executed services population commands from provider configurations
            - Updated data files in the `specs/` directory

            ## Review Checklist

            - [ ] Verify all generated data is accurate and properly formatted
            - [ ] Check that no sensitive information was accidentally included
            - [ ] Ensure all new files follow the repository's data structure conventions

            ---

            This PR was automatically created by the populate-services workflow.

            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: auto-populate-services
          delete-branch: true
          labels: |
            automated
            data-update

      - name: Summary
        if: always()
        run: |
          echo "## Populate Services Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "### Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "- Services population completed" >> $GITHUB_STEP_SUMMARY
            echo "- Pull request created" >> $GITHUB_STEP_SUMMARY
          else
            echo "### No Changes" >> $GITHUB_STEP_SUMMARY
            echo "- Services population completed" >> $GITHUB_STEP_SUMMARY
            echo "- No changes detected" >> $GITHUB_STEP_SUMMARY
          fi
