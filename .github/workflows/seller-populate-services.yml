name: Populate Services (reusable)

# Reusable populate-services shared by every unitysvc-services-* repo.
# Callers invoke it with:
#   jobs:
#     populate-services:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: unitysvc-labs/.github/.github/workflows/seller-populate-services.yml@main
#       secrets: inherit
#       with:
#         auto_merge: true   # optional — see the input below
#
# Provider API keys are repo secrets. `secrets: inherit` makes them available
# in the `secrets` context; the populate step then exports every inherited
# secret as an env var so `usvc_seller specs populate` finds its provider key
# regardless of name (FIREWORKS_API_KEY, OPENAI_API_KEY, ...). Repos that don't
# need populate simply omit the caller.

on:
  workflow_call:
    inputs:
      auto_merge:
        description: >-
          Merge the generated PR without human review once its checks
          (Validate Data, Format Check) pass. Only for repos whose every
          service is a BYOK LLM service — there the populate run can change
          nothing the platform bills for. Repos with managed (seller-key)
          channels, BYOE channels, or platform services must leave this off
          so a human reviews prices and deprecations. NOTE: merging the PR
          fires the caller's "Upload Data to Production" workflow, so with
          this on, a populate run publishes to production unattended.
        type: boolean
        required: false
        default: false

jobs:
  populate-services:
    name: Populate Services Data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # >=0.3.1: requires service_name from every iterator, deprecates
          # models the upstream no longer serves, and never lets a null
          # overwrite a known value. >=0.3.12: member-services/ (unitysvc#2569).
          pip install "unitysvc-sellers>=0.3.12"

      - name: Execute populate services command
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
          # Visibility each populated listing declares in
          # service_options.default_visibility. Resolves repo variable first,
          # then org. Deliberately has NO fallback: unset must mean "declare
          # nothing", because ingest treats an absent value as leave-it-alone
          # (`default_visibility or existing_service.visibility`), while any
          # literal here is re-applied on every upload. The old `|| 'unlisted'`
          # meant each populate+upload cycle silently unlisted services a human
          # had already made public — a default nobody set overriding a choice
          # someone did. A repo ready to publish by default sets the variable
          # to `public`; the populator omits the field when it is empty.
          DEFAULT_VISIBILITY: ${{ vars.DEFAULT_VISIBILITY }}
        run: |
          set -euo pipefail
          # Export every inherited repo secret as an env var so provider
          # populate commands find their API key regardless of name. Mask each
          # value. (GITHUB_TOKEN is provided separately and not in `secrets`.)
          while IFS= read -r k; do
            v="$(jq -r --arg k "$k" '.[$k]' <<<"$ALL_SECRETS_JSON")"
            echo "::add-mask::$v"
            export "$k=$v"
          done < <(jq -r 'keys[]' <<<"$ALL_SECRETS_JSON")
          echo "Running populate services command..."
          usvc_seller specs populate

      - name: Check for changes in specs/ directory
        id: check_changes
        run: |
          echo "Checking for changes in specs/ directory..."
          git add specs/
          if git diff --cached --exit-code specs/; then
            echo "No changes detected in specs/ directory"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in specs/ directory"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        id: create_pr
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          # NOT GITHUB_TOKEN. GitHub deliberately does not trigger workflows from
          # events created with GITHUB_TOKEN (its recursion guard), so a PR opened
          # with it gets check runs that are parked `action_required` or fail with
          # zero jobs. Measured across the 11 service repos on 2026-08-29: 137
          # bot-triggered pull_request runs, NOT ONE of which ever executed a job,
          # against 469 human-triggered runs of which none were ever parked. So
          # `Validate Data` and `Format Check` had never once run on a nightly
          # populate PR. A PAT makes the PR author a real identity and the checks
          # run normally. The fallback keeps the workflow working (with the old
          # parked-check behaviour) if the secret is ever missing.
          token: ${{ secrets.LABS_POPULATE_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: |
            Auto-populate services data

            Automated update of services data via usvc_seller specs populate

            Generated with GitHub Actions
          title: "Auto-populate services data"
          body: |
            ## Summary

            This PR contains automatically generated changes from running `usvc_seller specs populate`.

            ## Changes Made

            - Executed services population commands from provider configurations
            - Updated data files in the `specs/` directory
            - Marked as `deprecated` any service the upstream no longer serves

            ## Review Checklist

            - [ ] Verify all generated data is accurate and properly formatted
            - [ ] Check that no sensitive information was accidentally included
            - [ ] Ensure all new files follow the repository's data structure conventions
            - [ ] Review each `status: deprecated` — has the upstream really retired it?

            ---

            This PR was automatically created by the populate-services workflow.

            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: auto-populate-services
          delete-branch: true
          labels: |
            automated
            data-update

      # Opt-in (inputs.auto_merge). Waits for the PR's own checks and merges
      # only if every one of them passed — done here rather than with GitHub's
      # native auto-merge because that needs "Allow auto-merge" plus a branch
      # protection rule with required checks on every repo, and without the
      # rule `gh pr merge --auto` merges immediately, checks or not.
      #
      # Needs LABS_POPULATE_TOKEN, for the same recursion-guard reason as the
      # step above, twice over: a PR opened with GITHUB_TOKEN never gets its
      # checks run (nothing to gate on), and a merge made with GITHUB_TOKEN
      # would not fire the caller's production-upload workflow. Without the
      # secret the PR is simply left for a human.
      - name: Auto-merge Pull Request
        id: auto_merge
        if: >-
          inputs.auto_merge
          && steps.create_pr.outputs.pull-request-number
          && steps.create_pr.outputs.pull-request-operation != 'closed'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.LABS_POPULATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.create_pr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.create_pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::auto_merge is on but LABS_POPULATE_TOKEN is not set; leaving PR #$PR for manual review."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Checks are registered a few seconds after the push; wait until
          # the PR head is the commit we just pushed and has checks on it.
          for _ in $(seq 1 30); do
            head="$(gh pr view "$PR" --json headRefOid -q .headRefOid)"
            n="$(gh pr view "$PR" --json statusCheckRollup -q '.statusCheckRollup | length')"
            if [ "$head" = "$HEAD_SHA" ] && [ "$n" -gt 0 ]; then break; fi
            sleep 10
          done
          if [ "$head" != "$HEAD_SHA" ] || [ "$n" -eq 0 ]; then
            echo "::error::PR #$PR has no checks on $HEAD_SHA after 5 minutes; not merging unverified data."
            exit 1
          fi
          # Exits non-zero if any check fails, which fails this job and
          # leaves the PR open for a human.
          gh pr checks "$PR" --watch --fail-fast --interval 15
          # --match-head-commit: refuse to merge if the branch moved after
          # the checks we just watched.
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          echo "## Populate Services Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "### Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "- Services population completed" >> $GITHUB_STEP_SUMMARY
            echo "- Pull request created" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.auto_merge.outputs.merged }}" == "true" ]; then
              echo "- Pull request auto-merged after checks passed" >> $GITHUB_STEP_SUMMARY
            elif [ "${{ inputs.auto_merge }}" == "true" ]; then
              echo "- Auto-merge was requested but the pull request was NOT merged - see the Auto-merge step" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### No Changes" >> $GITHUB_STEP_SUMMARY
            echo "- Services population completed" >> $GITHUB_STEP_SUMMARY
            echo "- No changes detected" >> $GITHUB_STEP_SUMMARY
          fi
