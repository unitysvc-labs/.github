name: Populate Services (reusable)

# Reusable populate-services shared by every unitysvc-services-* repo.
# Callers invoke it with:
#   jobs:
#     populate-services:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: unitysvc-labs/.github/.github/workflows/seller-populate-services.yml@main
#       secrets: inherit
#
# Provider API keys are repo secrets. `secrets: inherit` makes them available
# in the `secrets` context; the populate step then exports every inherited
# secret as an env var so `usvc_seller specs populate` finds its provider key
# regardless of name (FIREWORKS_API_KEY, OPENAI_API_KEY, ...). Repos that don't
# need populate simply omit the caller.

on:
  workflow_call:

jobs:
  populate-services:
    name: Populate Services Data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # >=0.2.25: `specs run-tests --category` + upstream_test_status recording
          pip install "unitysvc-sellers>=0.2.25"

      - name: Execute populate services command
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
          # Visibility each populated listing declares in
          # service_options.default_visibility. Resolves repo variable first,
          # then org — so the org sets the fleet floor (unlisted) and a repo
          # that has graduated to producing sound specs overrides it with
          # `public`. The `||` fallback matters: an unset variable expands to
          # the empty string, not to nothing, so a bare reference would hand
          # the populator "" instead of letting its own default apply.
          DEFAULT_VISIBILITY: ${{ vars.DEFAULT_VISIBILITY || 'unlisted' }}
        run: |
          set -euo pipefail
          # Export every inherited repo secret as an env var so provider
          # populate commands find their API key regardless of name. Mask each
          # value. (GITHUB_TOKEN is provided separately and not in `secrets`.)
          while IFS= read -r k; do
            v="$(jq -r --arg k "$k" '.[$k]' <<<"$ALL_SECRETS_JSON")"
            echo "::add-mask::$v"
            export "$k=$v"
          done < <(jq -r 'keys[]' <<<"$ALL_SECRETS_JSON")
          echo "Running populate services command..."
          usvc_seller specs populate

      - name: Record upstream connectivity status
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          # Same secret export as the populate step: the probe authenticates
          # against the provider's upstream, so it needs that provider's key.
          while IFS= read -r k; do
            v="$(jq -r --arg k "$k" '.[$k]' <<<"$ALL_SECRETS_JSON")"
            echo "::add-mask::$v"
            export "$k=$v"
          done < <(jq -r 'keys[]' <<<"$ALL_SECRETS_JSON")
          echo "Recording upstream connectivity status..."
          # Connectivity probes are curl/bash — no SDK installs — and are the
          # only category that gates `specs upload`. `|| true` is deliberate:
          # the job's purpose is to RECORD the outcome into each service.json so
          # a later upload can skip an upstream that cannot serve the model. A
          # failing probe must not abort the run or block the populate PR.
          usvc_seller specs run-tests --category connectivity --force || true

      - name: Check for changes in specs/ directory
        id: check_changes
        run: |
          echo "Checking for changes in specs/ directory..."
          git add specs/
          if git diff --cached --exit-code specs/; then
            echo "No changes detected in specs/ directory"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in specs/ directory"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Auto-populate services data

            Automated update of services data via usvc_seller specs populate

            Generated with GitHub Actions
          title: "Auto-populate services data"
          body: |
            ## Summary

            This PR contains automatically generated changes from running `usvc_seller specs populate`.

            ## Changes Made

            - Executed services population commands from provider configurations
            - Updated data files in the `specs/` directory
            - Recorded each service's upstream connectivity result as
              `upstream_test_status` in its `service.json` / `*.service.json`

            ## About `upstream_test_status`

            A service recorded `fail` could not be reached by the connectivity
            probe, so `usvc_seller specs upload` will skip it (override with
            `--ignore-test-status`). This does **not** unpublish an already-live
            service: the probe uses this repository's credential, while a BYOK
            customer calls the upstream with their own key and entitlements.
            A probe can also fail transiently, so check before acting on one.

            ## Review Checklist

            - [ ] Verify all generated data is accurate and properly formatted
            - [ ] Check that no sensitive information was accidentally included
            - [ ] Ensure all new files follow the repository's data structure conventions
            - [ ] Review any `upstream_test_status: fail` — is the upstream really down?

            ---

            This PR was automatically created by the populate-services workflow.

            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: auto-populate-services
          delete-branch: true
          labels: |
            automated
            data-update

      - name: Summary
        if: always()
        run: |
          echo "## Populate Services Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "### Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "- Services population completed" >> $GITHUB_STEP_SUMMARY
            echo "- Pull request created" >> $GITHUB_STEP_SUMMARY
          else
            echo "### No Changes" >> $GITHUB_STEP_SUMMARY
            echo "- Services population completed" >> $GITHUB_STEP_SUMMARY
            echo "- No changes detected" >> $GITHUB_STEP_SUMMARY
          fi
