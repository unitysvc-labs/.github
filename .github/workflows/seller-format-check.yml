name: Format Check (reusable)

# Reusable seller-data format check shared by every unitysvc-services-* repo.
# Callers invoke it with:
#   jobs:
#     format-check:
#       uses: unitysvc-labs/.github/.github/workflows/seller-format-check.yml@main
# (triggers live in the caller's `on:`).

on:
  workflow_call:

jobs:
  format-check:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "unitysvc-sellers>=0.2.0"

      - name: Check formatting
        run: |
          echo "Checking specs file formatting..."
          usvc_seller specs format --check

      - name: Format check summary
        if: always()
        run: |
          echo "## Format Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "**All formatting checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Formatting issues detected!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### How to fix:" >> $GITHUB_STEP_SUMMARY
            echo "1. Run \`usvc_seller specs format\` locally" >> $GITHUB_STEP_SUMMARY
            echo "2. Commit the formatted files" >> $GITHUB_STEP_SUMMARY
            echo "3. Push your changes" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks performed:" >> $GITHUB_STEP_SUMMARY
          echo "- JSON formatting (2-space indentation)" >> $GITHUB_STEP_SUMMARY
          echo "- TOML formatting" >> $GITHUB_STEP_SUMMARY
          echo "- Key sorting" >> $GITHUB_STEP_SUMMARY
