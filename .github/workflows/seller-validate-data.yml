name: Validate Data (reusable)

# Reusable seller-data validation shared by every unitysvc-services-* repo.
# Callers invoke it with:
#   jobs:
#     validate-data:
#       uses: unitysvc-labs/.github/.github/workflows/seller-validate-data.yml@main
# (triggers / path filters live in the caller's `on:`).

on:
  workflow_call:

jobs:
  validate-data:
    name: Validate Data Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install unitysvc-sellers
        run: |
          python -m pip install --upgrade pip
          pip install "unitysvc-sellers>=0.2.0"

      - name: Validate data directory
        run: |
          echo "Validating specs/ directory..."
          usvc_seller specs validate

      - name: Data validation summary
        if: always()
        run: |
          echo "## Data Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "- specs/ validation completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks Performed" >> $GITHUB_STEP_SUMMARY
          echo "- Schema compliance" >> $GITHUB_STEP_SUMMARY
          echo "- File references" >> $GITHUB_STEP_SUMMARY
          echo "- Directory name consistency" >> $GITHUB_STEP_SUMMARY
